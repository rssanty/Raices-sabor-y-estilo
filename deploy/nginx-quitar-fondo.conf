# Nginx: http://TU_IP/ -> app en 127.0.0.1:3000
# Copiar a /etc/nginx/sites-available/quitar-fondo y enlazar a sites-enabled.
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    # La 1ª petición descarga el modelo (~977 MB) y la inferencia en CPU
    # tarda: tiempos de espera largos.
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
